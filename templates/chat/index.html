<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COFINANCE CI - Support Client</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --primary: #0d7a3f;
            --primary-dark: #065a2c;
            --primary-light: #e8f5e9;
            --primary-50: #f0fdf4;
            --accent: #00b894;
            --bg: #fafdfa;
            --surface: #ffffff;
            --text: #1a1a2e;
            --text-secondary: #6b7280;
            --text-muted: #9ca3af;
            --border: #e5e7eb;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 20px rgba(0,0,0,0.08);
            --shadow-lg: 0 10px 40px rgba(0,0,0,0.1);
            --shadow-xl: 0 20px 60px rgba(13,122,63,0.12);
            --radius-sm: 8px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --radius-xl: 32px;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
            padding: 1.5rem;
            background-image:
                radial-gradient(ellipse at 10% 20%, rgba(13,122,63,0.04) 0%, transparent 50%),
                radial-gradient(ellipse at 90% 80%, rgba(0,184,148,0.04) 0%, transparent 50%);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.92); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .container {
            text-align: center;
            max-width: 680px;
            width: 100%;
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .logo-wrapper {
            margin-bottom: 1.5rem;
            animation: fadeIn 1s 0.2s both;
        }

        .logo-icon {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: var(--radius-lg);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            box-shadow: 0 8px 32px rgba(13,122,63,0.2);
        }

        .logo-icon svg {
            width: 36px;
            height: 36px;
            fill: white;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            color: var(--text);
            margin-bottom: 0.5rem;
            animation: fadeIn 1s 0.3s both;
        }

        h1 span {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 1.1rem;
            font-weight: 400;
            color: var(--text-secondary);
            margin-bottom: 3rem;
            line-height: 1.6;
            animation: fadeIn 1s 0.4s both;
        }

        .cards {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 3rem;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 2.5rem 2rem;
            width: 260px;
            text-decoration: none;
            color: var(--text);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: var(--shadow-sm);
            position: relative;
            overflow: hidden;
            animation: scaleIn 0.6s 0.5s both;
        }

        .card:nth-child(2) {
            animation-delay: 0.6s;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .card:hover::before {
            opacity: 1;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-xl);
            border-color: var(--primary);
        }

        .card:active {
            transform: translateY(-2px) scale(0.98);
        }

        .card-icon {
            width: 56px;
            height: 56px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.25rem;
            font-size: 1.5rem;
        }

        .card-icon.client {
            background: var(--primary-light);
            color: var(--primary);
        }

        .card-icon.agent {
            background: linear-gradient(135deg, rgba(0,184,148,0.1), rgba(13,122,63,0.08));
            color: var(--accent);
        }

        .card h2 {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            letter-spacing: -0.01em;
        }

        .card p {
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .card-arrow {
            display: inline-block;
            margin-top: 1rem;
            color: var(--primary);
            font-weight: 600;
            font-size: 0.85rem;
            opacity: 0;
            transform: translateX(-8px);
            transition: all 0.3s ease;
        }

        .card:hover .card-arrow {
            opacity: 1;
            transform: translateX(0);
        }

        .api-link-wrapper {
            animation: fadeIn 1s 0.8s both;
        }

        .api-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            padding: 0.75rem 1.5rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            transition: all 0.3s ease;
            background: var(--surface);
        }

        .api-link:hover {
            color: var(--primary);
            border-color: var(--primary);
            box-shadow: 0 4px 16px rgba(13,122,63,0.1);
        }

        .api-link svg {
            width: 16px;
            height: 16px;
            transition: transform 0.3s ease;
        }

        .api-link:hover svg {
            transform: translateX(4px);
        }

        .footer-decoration {
            margin-top: 3rem;
            animation: fadeIn 1s 1s both;
        }

        .dots {
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .dots span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--border);
            animation: float 3s ease-in-out infinite;
        }

        .dots span:nth-child(2) {
            animation-delay: 0.5s;
            background: var(--primary);
            opacity: 0.3;
        }

        .dots span:nth-child(3) {
            animation-delay: 1s;
            background: var(--accent);
            opacity: 0.2;
        }

        @media (max-width: 600px) {
            body { padding: 1rem; }
            h1 { font-size: 1.8rem; }
            .subtitle { font-size: 1rem; margin-bottom: 2rem; }
            .card { width: 100%; max-width: 320px; padding: 2rem 1.5rem; }
            .logo-icon { width: 60px; height: 60px; }
            .logo-icon svg { width: 30px; height: 30px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-wrapper">
            <div class="logo-icon">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                </svg>
            </div>
        </div>
        <h1>CO<span>FINANCE</span> CI</h1>
        <p class="subtitle">Support client en temps réel — Échangez instantanément avec nos conseillers</p>
        <div class="cards">
            <a href="/chat/client/" class="card">
                <div class="card-icon client">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                </div>
                <h2>Espace Client</h2>
                <p>Ouvrir une conversation de support avec nos conseillers</p>
                <span class="card-arrow">Accéder →</span>
            </a>
            <a href="/chat/agent/" class="card">
                <div class="card-icon agent">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                        <line x1="12" y1="8" x2="12" y2="12"/>
                        <line x1="9" y1="11" x2="15" y2="11"/>
                    </svg>
                </div>
                <h2>Espace Agent</h2>
                <p>Répondre aux clients et gérer les conversations en direct</p>
                <span class="card-arrow">Accéder →</span>
            </a>
        </div>
        <div class="api-link-wrapper">
            <a href="/api/docs/" class="api-link">
                Documentation API Swagger
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="5" y1="12" x2="19" y2="12"/>
                    <polyline points="12 5 19 12 12 19"/>
                </svg>
            </a>
        </div>
        <div class="footer-decoration">
            <div class="dots">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </div>
</body>
</html>
