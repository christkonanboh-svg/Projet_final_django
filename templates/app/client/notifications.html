{% extends "app/base.html" %}
{% block title %}Notifications{% endblock %}
{% block page_title %}Notifications{% endblock %}
{% block content %}
<div class="page-header flex items-center justify-between"><div><h1>Notifications</h1><p>Restez informé</p></div><button class="btn btn-sm btn-outline" onclick="markAllRead()">Tout marquer lu</button></div>
<div class="card"><div class="card-body" id="notificationsContainer"><div class="loading">Chargement</div></div></div>
{% endblock %}
{% block extra_scripts %}
<script>
async function loadNotifs() {
    try {
        const res = await fetch(`${API}/api/notifications/`, { headers: authHeaders() });
        const data = await res.json(); const notifs = data.results || data || [];
        const container = document.getElementById('notificationsContainer');
        if (!notifs.length) { container.innerHTML = '<div class="empty-state"><p>Aucune notification</p></div>'; return; }
        container.innerHTML = '<div style="display:flex;flex-direction:column">' + notifs.map(n => `
            <div style="display:flex;gap:1rem;padding:1rem 0;border-bottom:1px solid var(--border-light);${!n.is_read?'background:var(--primary-50);margin:0 -1rem;padding:1rem;border-radius:var(--radius-sm)':''}">
                <div style="width:36px;height:36px;border-radius:50%;background:${!n.is_read?'var(--primary-light)':'var(--border-light)'};display:flex;align-items:center;justify-content:center;flex-shrink:0;color:${!n.is_read?'var(--primary)':'var(--text-muted)'}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></div>
                <div style="flex:1"><div style="font-weight:600;font-size:0.9rem">${n.title}</div><p style="font-size:0.85rem;color:var(--text-secondary);margin-top:0.2rem">${n.message}</p><span style="font-size:0.7rem;color:var(--text-muted)">${formatDateTime(n.created_at)}</span></div>
                ${!n.is_read?`<button class="btn btn-xs btn-ghost" onclick="markRead('${n.id}')">Lu</button>`:''}
            </div>`).join('') + '</div>';
    } catch {}
}
async function markRead(id) { await fetch(`${API}/api/notifications/${id}/read/`, { method:'PATCH', headers:authHeaders() }); loadNotifs(); loadNotifCount(); }
async function markAllRead() { await fetch(`${API}/api/notifications/mark-all-read/`, { method:'POST', headers:authHeaders() }); showToast('Marquées lues','success'); loadNotifs(); loadNotifCount(); }
loadNotifs();
</script>
{% endblock %}
