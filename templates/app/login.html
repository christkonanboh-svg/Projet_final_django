<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>COFINANCE CI - Connexion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --primary: #0d7a3f; --primary-dark: #065a2c; --accent: #00b894;
            --text: #1a1a2e; --text-secondary: #6b7280; --text-muted: #9ca3af;
            --border: #e5e7eb; --border-light: #f0f0f0;
            --surface: #ffffff; --bg: #f8fbf8;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 24px rgba(0,0,0,0.08);
            --shadow-lg: 0 8px 40px rgba(0,0,0,0.1);
            --radius-sm: 8px; --radius-md: 16px; --radius-lg: 24px;
            --transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
            padding: 1.5rem;
            background-image: radial-gradient(ellipse at 10% 20%, rgba(13,122,63,0.04) 0%, transparent 50%), radial-gradient(ellipse at 90% 80%, rgba(0,184,148,0.04) 0%, transparent 50%);
        }
        .login-container { width: 100%; max-width: 420px; animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both; }
        .login-header { text-align: center; margin-bottom: 2rem; }
        .logo-icon {
            width: 64px; height: 64px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: var(--radius-md);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 1.25rem;
            box-shadow: 0 8px 32px rgba(13,122,63,0.2);
        }
        .logo-icon svg { width: 32px; height: 32px; fill: white; }
        .login-header h1 { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; }
        .login-header h1 span { background: linear-gradient(135deg, var(--primary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .login-header p { font-size: 0.9rem; color: var(--text-secondary); margin-top: 0.35rem; }
        .login-card {
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: 2.5rem 2rem;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-light);
        }
        .login-card:hover { box-shadow: var(--shadow-lg); }
        .form-group { margin-bottom: 1.25rem; }
        .form-group label { display: block; margin-bottom: 0.4rem; font-size: 0.8rem; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.04em; }
        .form-group input {
            width: 100%; padding: 0.85rem 1rem;
            border: 1.5px solid var(--border); border-radius: var(--radius-sm);
            font-size: 0.95rem; font-family: inherit;
            transition: var(--transition); background: var(--bg); color: var(--text); outline: none;
        }
        .form-group input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(13,122,63,0.1); background: var(--surface); }
        .btn {
            width: 100%; padding: 0.85rem 1.5rem;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white; border: none; border-radius: var(--radius-sm);
            font-size: 0.95rem; font-weight: 600; font-family: inherit;
            cursor: pointer; transition: var(--transition); position: relative; overflow: hidden;
        }
        .btn:hover { box-shadow: 0 4px 20px rgba(13,122,63,0.3); transform: translateY(-1px); }
        .btn:active { transform: translateY(0) scale(0.98); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }
        .btn::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent); background-size: 200% 100%; animation: shimmer 2s infinite; pointer-events: none; }
        .error-msg { color: #dc2626; font-size: 0.85rem; margin-top: 0.75rem; text-align: center; font-weight: 500; }
        .login-footer { text-align: center; margin-top: 1.5rem; font-size: 0.8rem; color: var(--text-muted); }
        .login-footer a { color: var(--primary); text-decoration: none; font-weight: 600; }
        .login-footer a:hover { text-decoration: underline; }
        .login-hint { font-size: 0.75rem; color: var(--text-muted); text-align: center; margin-top: 0.5rem; padding: 0.5rem; background: var(--bg); border-radius: var(--radius-sm); }
        @media (max-width: 480px) { .login-card { padding: 2rem 1.25rem; } .login-header h1 { font-size: 1.3rem; } }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="logo-icon">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
            </div>
            <h1>CO<span>FINANCE</span> CI</h1>
            <p>Plateforme de gestion financière</p>
        </div>
        <div class="login-card">
            <div class="form-group">
                <label>Identifiant</label>
                <input type="text" id="username" placeholder="Votre identifiant" value="client1">
            </div>
            <div class="form-group">
                <label>Mot de passe</label>
                <input type="password" id="password" placeholder="Votre mot de passe" onkeydown="if(event.key==='Enter')login()">
            </div>
            <button onclick="login()" id="loginBtn">Se connecter</button>
            <p class="error-msg" id="loginError"></p>
            <div class="login-hint">Client: client1/client123 · Agent: agent1/agent123 · Admin: admin/admin123</div>
        </div>
        <div class="login-footer">
            <span>COFINANCE CI © 2026</span>
        </div>
    </div>

    <script>
        const API = window.location.origin;

        function getRolePath(role) {
            const map = { 'client': '/app/client/dashboard/', 'agent': '/app/agent/dashboard/', 'admin': '/app/admin/dashboard/' };
            return map[role] || '/app/client/dashboard/';
        }

        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');
            const errEl = document.getElementById('loginError');
            errEl.textContent = '';
            btn.disabled = true;
            btn.textContent = 'Connexion...';
            try {
                const res = await fetch(`${API}/api/auth/login/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                if (!res.ok) throw new Error('Identifiants incorrects');
                const data = await res.json();
                localStorage.setItem('access_token', data.access);
                if (data.refresh) localStorage.setItem('refresh_token', data.refresh);

                const meRes = await fetch(`${API}/api/auth/me/`, { headers: { 'Authorization': `Bearer ${data.access}` } });
                if (!meRes.ok) throw new Error('Erreur chargement profil');
                const me = await meRes.json();
                localStorage.setItem('user_role', me.role);

                window.location.href = getRolePath(me.role);
            } catch (e) {
                errEl.textContent = e.message;
                btn.disabled = false;
                btn.textContent = 'Se connecter';
            }
        }

        if (localStorage.getItem('access_token')) {
            const role = localStorage.getItem('user_role') || 'client';
            window.location.href = getRolePath(role);
        }
    </script>
</body>
</html>
