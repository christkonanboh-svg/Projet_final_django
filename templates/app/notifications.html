{% extends "app/base.html" %}{% load static %}
{% block title %}COFINANCE CI - Notifications{% endblock %}
{% block page_title %}Notifications{% endblock %}
{% block content %}
<div class="page-header flex items-center justify-between">
    <div><h1>Notifications</h1><p>Restez informé de vos activités</p></div>
    <button class="btn btn-sm btn-outline" onclick="markAllRead()">Tout marquer lu</button>
</div>
<div class="card"><div class="card-body" id="notificationsContainer"><div class="loading">Chargement</div></div></div>
{% endblock %}
{% block extra_scripts %}
<script>
async function loadNotifications() {
    try {
        const res = await fetch(`${API}/api/notifications/`, { headers: authHeaders() });
        const data = await res.json();
        const notifications = data.results || data || [];
        renderNotifications(notifications);
    } catch(e) { document.getElementById('notificationsContainer').innerHTML = '<div class="empty-state"><p>Erreur de chargement</p></div>'; }
}

function renderNotifications(notifications) {
    const container = document.getElementById('notificationsContainer');
    if (!notifications.length) {
        container.innerHTML = '<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><h3>Aucune notification</h3><p>Vous serez notifié des mises à jour ici</p></div>';
        return;
    }
    container.innerHTML = '<div style="display:flex;flex-direction:column">' + notifications.map(n => `
        <div style="display:flex;gap:1rem;padding:1rem 0;border-bottom:1px solid var(--border-light);${!n.is_read ? 'background:var(--primary-50);margin:0 -1rem;padding:1rem;border-radius:var(--radius-sm)' : ''}">
            <div style="width:40px;height:40px;border-radius:50%;background:${!n.is_read ? 'var(--primary-light)' : 'var(--border-light)'};display:flex;align-items:center;justify-content:center;flex-shrink:0;color:${!n.is_read ? 'var(--primary)' : 'var(--text-muted)'}">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            </div>
            <div style="flex:1;min-width:0">
                <div style="display:flex;justify-content:space-between;align-items:start;gap:0.5rem">
                    <div><strong style="font-size:0.9rem">${n.title}</strong>
                    <p style="font-size:0.85rem;color:var(--text-secondary);margin-top:0.2rem">${n.message}</p></div>
                    <div style="display:flex;align-items:center;gap:0.5rem;flex-shrink:0">
                        <span style="font-size:0.7rem;color:var(--text-muted);white-space:nowrap">${formatDateTime(n.created_at)}</span>
                        ${!n.is_read ? `<button class="btn btn-sm btn-ghost" onclick="markRead(${n.id})" style="font-size:0.7rem">Marquer lu</button>` : ''}
                    </div>
                </div>
            </div>
        </div>
    `).join('') + '</div>';
}

async function markRead(id) {
    try {
        await fetch(`${API}/api/notifications/${id}/read/`, { method: 'PATCH', headers: authHeaders() });
        loadNotifications();
        loadNotifCount();
    } catch {}
}

async function markAllRead() {
    try {
        await fetch(`${API}/api/notifications/mark-all-read/`, { method: 'POST', headers: authHeaders() });
        showToast('Toutes les notifications marquées comme lues', 'success');
        loadNotifications();
        loadNotifCount();
    } catch {}
}

loadNotifications();
</script>
{% endblock %}
